<!-- TITULO -->
<section class="projects-header">
    <h1>Projects</h1>
    <p>Illustrations and artwork</p>
</section>

<!-- Grid para las miniaturas -->
<main class="projects-grid">

    <!-- Cada figure es una ilustración -->
    <!-- "figcaption" es el título para cada ilustración -->
    <!-- <a> para que al hacer click se abra la imagen en grande de la miniatura -->
    <figure>
        <figcaption>Girl Illustration</figcaption>
        <a href="#modal-girl">
            <img src="Assets/IMG/Girl.png" alt="Girl">
        </a>
    </figure>

        <a href="#modal-cat">

        <a href="#modal-mushrooms">
            <img src="Assets/IMG/Mushrooms.png" alt="Mushrooms">
        </a>
    </figure>

        <figcaption>Fashion Design</figcaption>
        <a href="#modal-design">
            <img src="Assets/IMG/Design.png" alt="Design">
        </a>

    <figure>

        <a href="#modal-snake">
            <img src="Assets/IMG/Snake.jpg" alt="Snake">
        </a>

    <figure>

        <a href="#modal-flowers">

            <img src="Assets/IMG/Balloon.jpg" alt="Balloon">

</main>

<!-- MODALES DE IMÁGENES-->

<!-- Cada modal se identifica por su id y aparece al hacer click -->
<!-- Se activa al hacer click en el <a> correspondiente -->
<!-- :target en CSS hace que se muestre solo el modal seleccionado -->
<!-- La cruz (&times;) es para cerrar el modal -->
<div id="modal-girl" class="modal">
    <a href="#" class="modal-close">&times;</a>
    <img class="modal-content" src="Assets/IMG/Girl.png" alt="Girl">
</div>
